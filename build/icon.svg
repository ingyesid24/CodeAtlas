<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1C2E48"/>
      <stop offset="100%" stop-color="#0F1B2B"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="98" fill="none" stroke="#2A3D5C" stroke-width="2"/>

  <!-- anillo de brújula -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#2A3D5C" stroke-width="2"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#C9A15A" stroke-width="2" stroke-dasharray="2 10" opacity="0.55"/>

  <!-- puntas de brújula -->
  <g stroke="#C9A15A" stroke-width="2" opacity="0.8">
    <line x1="256" y1="70" x2="256" y2="100"/>
    <line x1="256" y1="412" x2="256" y2="442"/>
    <line x1="70" y1="256" x2="100" y2="256"/>
    <line x1="412" y1="256" x2="442" y2="256"/>
  </g>

  <!-- aristas del grafo (mapa de módulos) -->
  <g stroke="#4FB6A8" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="196" y1="196" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="330" y2="206"/>
    <line x1="256" y1="256" x2="220" y2="336"/>
    <line x1="256" y1="256" x2="336" y2="322"/>
  </g>

  <!-- nodos -->
  <circle cx="256" cy="256" r="20" fill="#C9A15A"/>
  <circle cx="196" cy="196" r="13" fill="#4FB6A8"/>
  <circle cx="330" cy="206" r="13" fill="#4FB6A8"/>
  <circle cx="220" cy="336" r="13" fill="#4FB6A8"/>
  <circle cx="336" cy="322" r="13" fill="#D97757"/>

  <circle cx="256" cy="256" r="20" fill="none" stroke="#0F1B2B" stroke-width="3"/>
