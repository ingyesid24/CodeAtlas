name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            glob: |
              release/*.AppImage
            args: --linux AppImage
            cache: ~/.cache/electron-builder
          - os: windows-latest
            artifact: windows
            glob: |
              release/*.exe
            args: --win nsis portable
            cache: ~/AppData/Local/electron-builder/Cache
          - os: macos-latest
            artifact: macos
            glob: |
              release/*.dmg
              release/*.zip
            args: --mac dmg zip
            cache: ~/Library/Caches/electron-builder
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: electron-builder-${{ matrix.os }}
      - run: npm ci
      - run: npm run build
      - name: Package app (retry on transient binary download failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "electron-builder attempt $attempt"
            if npx electron-builder --publish never ${{ matrix.args }}; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: codeatlas-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
